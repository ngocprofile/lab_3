spring.application.name=schoolmanager

# Tự động nhận cổng từ server (Render) hoặc mặc định là 8080 nếu chạy ở máy
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION (SQL Server)
# ===============================
# Sử dụng biến môi trường để linh hoạt giữa Local và Deploy
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sử dụng Dialect hiện đại hơn để tương thích tốt với SQL Server 2012+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

# ===============================
# ENCODING (QUAN TRỌNG: SỬA LỖI TIẾNG VIỆT)
# ===============================
# Duy trì cấu hình UTF-8 để đảm bảo API và giao diện không lỗi font
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ===============================
# THYMELEAF (PRODUCTION)
# ===============================
# Khi deploy nên để cache=true để tăng tốc độ, nhưng test thì có thể để false
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8