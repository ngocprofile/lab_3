spring.datasource.url=jdbc:sqlserver://LAPTOP-96581BJ9:1433;instanceName=NGOC3103;databaseName=DTN_Spring;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;
