<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản Lý Sinh Viên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f9;
        font-family: "Segoe UI", sans-serif;
      }
      .main-card {
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        border: none;
      }
      .table-action-btn {
        margin: 0 3px;
      }
      /* Toast nằm góc trên bên phải đẹp hơn */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1055;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 shadow-sm">
      <span class="navbar-brand fw-bold">
        <i class="fas fa-user-graduate"></i> Student Manager
      </span>

      <div class="ms-auto d-flex align-items-center text-white">
        <span class="me-3" id="userInfo">
          <i class="fas fa-spinner fa-spin"></i> Loading...
        </span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>
      </div>
    </nav>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container py-4">
      <div class="row g-4">
        <div class="col-md-4" id="adminForm">
          <div class="card main-card h-100">
            <div class="card-header bg-success text-white fw-bold">
              <i class="fas fa-plus-circle"></i> Thêm Sinh Viên
            </div>
            <div class="card-body">
              <form id="addStudentForm">
                <div class="mb-3">
                  <label class="form-label" for="addName">Họ tên</label>
                  <input
                    class="form-control"
                    id="addName"
                    placeholder="Nhập họ tên..."
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="addEmail">Email</label>
                  <input
                    class="form-control"
                    id="addEmail"
                    type="email"
                    placeholder="example@email.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="addGender">Giới tính</label>
                  <select class="form-control" id="addGender">
                    <option value="MALE">Nam</option>
                    <option value="FEMALE">Nữ</option>
                    <option value="OTHER">Khác</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-success w-100">
                  <i class="fas fa-save"></i> Lưu sinh viên
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-8" id="tableColumn">
          <div class="card main-card">
            <div
              class="card-header d-flex justify-content-between align-items-center bg-white py-3"
            >
              <span class="fw-bold text-primary fs-5">
                <i class="fas fa-list"></i> Danh sách sinh viên
              </span>
              <div class="input-group w-50">
                <input
                  id="searchInput"
                  class="form-control"
                  placeholder="Tìm theo tên..."
                />
                <button class="btn btn-primary" onclick="searchStudent()">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>

            <div class="card-body p-0 table-responsive">
              <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-light text-secondary">
                  <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Giới tính</th>
                    <th id="actionCol">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning">
            <h5 class="modal-title fw-bold">
              <i class="fas fa-edit"></i> Cập nhật thông tin
            </h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId" />

            <div class="mb-3">
              <label for="editName" class="form-label">Họ tên</label>
              <input class="form-control" id="editName" />
            </div>
            <div class="mb-3">
              <label for="editEmail" class="form-label">Email</label>
              <input class="form-control" id="editEmail" />
            </div>
            <div class="mb-3">
              <label for="editGender" class="form-label">Giới tính</label>
              <select class="form-control" id="editGender">
                <option value="MALE">Nam</option>
                <option value="FEMALE">Nữ</option>
                <option value="OTHER">Khác</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
            <button class="btn btn-primary" onclick="submitEdit()">
              <i class="fas fa-check"></i> Lưu thay đổi
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="viewModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title fw-bold">
              <i class="fas fa-id-card"></i> Thông Tin Chi Tiết
            </h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="text-center mb-4">
              <i class="fas fa-user-circle fa-5x text-secondary"></i>
            </div>
            <table class="table table-bordered">
              <tbody>
                <tr>
                  <th class="bg-light w-25">ID</th>
                  <td id="viewId" class="fw-bold"></td>
                </tr>
                <tr>
                  <th class="bg-light">Họ tên</th>
                  <td id="viewName"></td>
                </tr>
                <tr>
                  <th class="bg-light">Email</th>
                  <td id="viewEmail"></td>
                </tr>
                <tr>
                  <th class="bg-light">Giới tính</th>
                  <td id="viewGender"></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const API = "/api/students"; // URL API của bạn

      // 1. Lấy thông tin User từ LocalStorage (Chỉ lấy Role và Username để hiển thị UI)
      // TUYỆT ĐỐI KHÔNG LƯU PASSWORD Ở ĐÂY NỮA
      const username = localStorage.getItem("username");
      const role = localStorage.getItem("role");

      let editModalInstance;
      let viewModalInstance;

      // 2. Cấu hình Fetch mặc định: QUAN TRỌNG NHẤT
      // credentials: "include" giúp gửi Cookie JSESSIONID đi kèm request
      const requestOptions = {
        headers: { "Content-Type": "application/json" },
        credentials: "include",
      };

      // 3. Kiểm tra sơ bộ ở Frontend
      if (!username) {
        window.location.href = "login.html";
      }

      // 4. Setup giao diện theo Role
      document.getElementById("userInfo").innerText = `Xin chào, ${username}`;

      // Nếu không phải ADMIN thì ẩn các chức năng thêm/sửa/xóa trên giao diện
      if (role !== "ROLE_ADMIN") {
        const adminForm = document.getElementById("adminForm");
        const actionCol = document.getElementById("actionCol");

        if (adminForm) adminForm.remove();

        // Mở rộng bảng ra full màn hình
        const tableCol = document.getElementById("tableColumn");
        if (tableCol) tableCol.className = "col-md-12";
      }

      // 5. Khởi chạy khi trang tải xong
      document.addEventListener("DOMContentLoaded", () => {
        // Khởi tạo Modal của Bootstrap
        editModalInstance = new bootstrap.Modal(
          document.getElementById("editModal"),
        );
        viewModalInstance = new bootstrap.Modal(
          document.getElementById("viewModal"),
        );

        // Tải dữ liệu
        loadStudents();
      });

      // --- CÁC HÀM XỬ LÝ CHÍNH ---

      // Tải danh sách sinh viên
      function loadStudents(searchQuery = "") {
        const url = searchQuery ? `${API}?name=${searchQuery}` : API;

        fetch(url, { method: "GET", ...requestOptions })
          .then((res) => {
            // Nếu Server trả về 401 (Chưa đăng nhập) hoặc 403 (Không có quyền)
            if (res.status === 401 || res.status === 403) {
              logout(); // Đăng xuất ngay
              return null;
            }
            return res.json();
          })
          .then((data) => {
            if (data) renderTable(data);
          })
          .catch((err) => {
            console.error("Lỗi tải danh sách:", err);
            // showToast("Không thể kết nối đến Server", "error");
          });
      }

      // Hiển thị bảng dữ liệu
      function renderTable(data) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-muted py-4">Không tìm thấy dữ liệu nào</td></tr>`;
          return;
        }

        data.forEach((s) => {
          // Nút Xem (Ai cũng thấy)
          let buttons = `
              <button class="btn btn-sm btn-outline-info table-action-btn" onclick="openView(${s.id})" title="Xem chi tiết">
                  <i class="fas fa-eye"></i>
              </button>
          `;

          // Nút Sửa/Xóa (Chỉ ADMIN thấy)
          if (role === "ROLE_ADMIN") {
            buttons += `
                <button class="btn btn-sm btn-outline-warning table-action-btn" onclick="openEdit(${s.id})" title="Sửa">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger table-action-btn" onclick="del(${s.id})" title="Xóa">
                    <i class="fas fa-trash"></i>
                </button>
            `;
          }

          tbody.innerHTML += `
              <tr>
                  <td>${s.id}</td>
                  <td class="fw-bold text-primary">${s.name}</td>
                  <td>${s.email}</td>
                  <td>${formatGender(s.gender)}</td> 
                  <td>${buttons}</td>
              </tr>`;
        });
      }

      // Xử lý Thêm mới (Submit Form)
      document
        .getElementById("addStudentForm")
        ?.addEventListener("submit", (e) => {
          e.preventDefault();

          const newStudent = {
            name: document.getElementById("addName").value,
            email: document.getElementById("addEmail").value,
            gender: document.getElementById("addGender").value,
          };

          fetch(API, {
            method: "POST",
            headers: requestOptions.headers,
            credentials: requestOptions.credentials, // Gửi Cookie
            body: JSON.stringify(newStudent),
          }).then((res) => {
            if (res.ok) {
              showToast("Thêm sinh viên thành công!", "success");
              loadStudents();
              e.target.reset(); // Xóa trắng form
            } else {
              showToast("Lỗi! Bạn không có quyền hoặc dữ liệu sai.", "error");
            }
          });
        });

      // Mở Modal Sửa (Lấy dữ liệu cũ đổ vào form)
      function openEdit(id) {
        fetch(`${API}/${id}`, { method: "GET", ...requestOptions })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("editId").value = data.id;
            document.getElementById("editName").value = data.name;
            document.getElementById("editEmail").value = data.email;
            document.getElementById("editGender").value = data.gender;

            editModalInstance.show();
          })
          .catch(() => showToast("Không tải được thông tin!", "error"));
      }

      // Submit cập nhật (PUT)
      function submitEdit() {
        const id = document.getElementById("editId").value;
        const updatedData = {
          name: document.getElementById("editName").value,
          email: document.getElementById("editEmail").value,
          gender: document.getElementById("editGender").value,
        };

        fetch(`${API}/${id}`, {
          method: "PUT",
          headers: requestOptions.headers,
          credentials: requestOptions.credentials,
          body: JSON.stringify(updatedData),
        }).then((res) => {
          if (res.ok) {
            showToast("Cập nhật thành công!", "success");
            editModalInstance.hide();
            loadStudents();
          } else {
            showToast("Lỗi cập nhật!", "error");
          }
        });
      }

      // Xóa sinh viên (DELETE)
      function del(id) {
        if (
          confirm(
            "Bạn có chắc chắn muốn xóa sinh viên này? Hành động này không thể hoàn tác.",
          )
        ) {
          fetch(`${API}/${id}`, {
            method: "DELETE",
            ...requestOptions,
          }).then((res) => {
            if (res.ok) {
              showToast("Đã xóa sinh viên!", "success");
              loadStudents();
            } else {
              showToast("Lỗi! Bạn không có quyền xóa.", "error");
            }
          });
        }
      }

      // Tìm kiếm
      function searchStudent() {
        const keyword = document.getElementById("searchInput").value;
        loadStudents(keyword);
      }

      // Xem chi tiết
      function openView(id) {
        fetch(`${API}/${id}`, { method: "GET", ...requestOptions })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("viewId").innerText = data.id;
            document.getElementById("viewName").innerText = data.name;
            document.getElementById("viewEmail").innerText = data.email;
            document.getElementById("viewGender").innerHTML = formatGender(
              data.gender,
            );

            viewModalInstance.show();
          })
          .catch(() => showToast("Lỗi tải chi tiết!", "error"));
      }

      // Đăng xuất (Gọi API Logout của Server)
      function logout() {
        fetch("/logout", { method: "POST", ...requestOptions }) // Endpoint mặc định của Spring Security
          .finally(() => {
            localStorage.clear(); // Xóa Role/Username ở client
            window.location.href = "login.html"; // Quay về trang login
          });
      }

      // --- CÁC HÀM TIỆN ÍCH ---

      // Format giới tính ra Badge đẹp
      function formatGender(genderCode) {
        if (genderCode === "MALE")
          return '<span class="badge bg-primary">Nam</span>';
        if (genderCode === "FEMALE")
          return '<span class="badge bg-danger">Nữ</span>';
        return '<span class="badge bg-secondary">Khác</span>';
      }

      // Hiển thị thông báo (Toast)
      function showToast(msg, type = "success") {
        const container = document.getElementById("toastContainer");
        const bgColor = type === "success" ? "bg-success" : "bg-danger";
        const icon =
          type === "success" ? "fa-check-circle" : "fa-exclamation-triangle";

        const toastEl = document.createElement("div");
        toastEl.className = `toast show align-items-center text-white ${bgColor} border-0 mb-2`;
        toastEl.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fas ${icon}"></i> ${msg}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>`;

        container.appendChild(toastEl);

        // Tự động tắt sau 3 giây
        setTimeout(() => {
          toastEl.remove();
        }, 3000);
      }
    </script>
  </body>
</html>
